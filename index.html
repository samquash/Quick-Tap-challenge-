<!DOCTYPE html>
<html lang="ur">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f3be8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quick Tap Challenge</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#07060f; --panel:#12102a; --cyan:#00f0ff; --pink:#ff2bd6; --lime:#b6ff3c; --red:#ff3860; --text:#e8e6ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { height:100%; margin:0; }
  body {
    background:radial-gradient(circle at 50% 0%, #1b1450 0%, var(--bg) 60%);
    color:var(--text); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:manipulation;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .game {
    position:relative; width:min(94vw,460px); padding:20px 18px 26px; background:var(--panel);
    border:2px solid var(--cyan); border-radius:22px; text-align:center; overflow:hidden;
    box-shadow:0 0 25px rgba(0,240,255,.35), inset 0 0 25px rgba(255,43,214,.12);
  }
  h1 { margin:0 0 14px; font-size:clamp(1.3rem,5vw,1.8rem); letter-spacing:2px; color:var(--cyan);
       text-shadow:0 0 10px var(--cyan),0 0 22px var(--pink); text-transform:uppercase; }
  .stats { display:flex; gap:8px; margin-bottom:14px; }
  .stat { flex:1; background:#0b0a1e; border:1px solid #2b2670; border-radius:12px; padding:8px 4px; }
  .stat small { display:block; font-size:.65rem; opacity:.7; letter-spacing:1px; text-transform:uppercase; }
  .stat b { font-size:1.2rem; color:var(--lime); text-shadow:0 0 8px var(--lime); }
  .timer { font-size:2.6rem; font-weight:800; color:var(--pink); text-shadow:0 0 14px var(--pink); margin:4px 0; }
  .timer.low { color:var(--red); animation:blink .5s infinite; }
  @keyframes blink { 50% { opacity:.4; } }
  .bar { height:16px; background:#0b0a1e; border:1px solid #2b2670; border-radius:10px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; width:0; transition:width .08s linear; }
  #progressFill { background:linear-gradient(90deg,var(--cyan),var(--lime)); box-shadow:0 0 12px var(--cyan); }
  #timeFill { background:linear-gradient(90deg,var(--pink),var(--red)); width:100%; transition:none; }
  .bar-label { font-size:.8rem; opacity:.85; margin-top:6px; }
  #tapBtn {
    position:relative; overflow:hidden; width:min(55vw,220px); height:min(55vw,220px);
    margin:18px auto 6px; display:block; border:4px solid var(--pink); border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff7be9, var(--pink) 55%, #7a0b68);
    color:#fff; font-size:1.7rem; font-weight:900; letter-spacing:2px; cursor:pointer;
    box-shadow:0 0 30px var(--pink), inset 0 0 25px rgba(255,255,255,.25); transition:transform .06s;
  }
  #tapBtn.pressed { transform:scale(.92); }
  #tapBtn:disabled { filter:grayscale(.8) brightness(.6); cursor:default; box-shadow:none; }
  #tapBtn.pulse { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 55px var(--pink), inset 0 0 25px rgba(255,255,255,.4); } }
  .ripple { position:absolute; border-radius:50%; pointer-events:none; background:rgba(255,255,255,.55);
            transform:scale(0); animation:ripple .55s ease-out forwards; }
  @keyframes ripple { to { transform:scale(1); opacity:0; } }
  .float { position:fixed; pointer-events:none; font-weight:800; color:var(--lime);
           text-shadow:0 0 8px var(--lime); animation:floatUp .7s ease-out forwards; z-index:50; }
  @keyframes floatUp { to { transform:translateY(-60px); opacity:0; } }
  .shake { animation:shake .4s; }
  @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  #overlay { position:absolute; inset:0; z-index:10; background:rgba(7,6,15,.93); display:flex;
             flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:10px; }
  #overlay.hidden { display:none; }
  #ovTitle { font-size:2rem; margin:0; text-transform:uppercase; letter-spacing:2px; }
  #ovText { margin:0 0 8px; line-height:1.6; opacity:.9; white-space:pre-line; }
  .btn { position:relative; overflow:hidden; cursor:pointer; padding:14px 34px; font-size:1.1rem; font-weight:800;
         letter-spacing:1px; color:#07060f; background:var(--cyan); border:none; border-radius:40px;
         box-shadow:0 0 20px var(--cyan); text-transform:uppercase; }
  .btn:active { transform:scale(.95); }
  .win { color:var(--lime); text-shadow:0 0 14px var(--lime); }
  .lose { color:var(--red); text-shadow:0 0 14px var(--red); }
  .info { color:var(--cyan); text-shadow:0 0 14px var(--cyan); }
</style>
</head>
<body>
<div class="game" id="game">
  <h1>⚡ Quick Tap Challenge</h1>
  <div class="stats">
    <div class="stat"><small>Level</small><b id="levelVal">1</b></div>
    <div class="stat"><small>Score</small><b id="scoreVal">0</b></div>
    <div class="stat"><small>High Score</small><b id="highVal">0</b></div>
  </div>
  <div class="timer" id="timerVal">10.0</div>
  <div class="bar"><div id="timeFill"></div></div>
  <div class="bar"><div id="progressFill"></div></div>
  <div class="bar-label"><span id="tapCount">0</span> / <span id="tapTarget">0</span> taps</div>
  <button id="tapBtn" disabled>TAP!</button>
  <div id="overlay">
    <h2 id="ovTitle" class="info">Quick Tap</h2>
    <p id="ovText"></p>
    <button class="btn" id="ovBtn">Start</button>
  </div>
</div>

<script>
(() => {
  'use strict';
  // Level config: target taps barhte hain, time kam hota hai
  const LEVELS = [
    { target: 20, time: 10 }, { target: 30, time: 10 }, { target: 40, time: 9 },
    { target: 50, time: 8 },  { target: 60, time: 7 }
  ];
  const STORAGE_KEY = 'quickTapHighScore';
  const $ = id => document.getElementById(id);
  const el = {
    game:$('game'), level:$('levelVal'), score:$('scoreVal'), high:$('highVal'), timer:$('timerVal'),
    timeFill:$('timeFill'), progFill:$('progressFill'), count:$('tapCount'), target:$('tapTarget'),
    tapBtn:$('tapBtn'), overlay:$('overlay'), ovTitle:$('ovTitle'), ovText:$('ovText'), ovBtn:$('ovBtn')
  };

  let levelIdx = 0, score = 0, taps = 0, timeLeft = 0, endTime = 0, timerId = null;
  let state = 'menu'; // menu | ready | playing | over
  let highScore = loadHigh();
  let onOverlayBtn = startGame;

  // High score (localStorage, safe wrapper)
  function loadHigh() { try { return parseInt(localStorage.getItem(STORAGE_KEY), 10) || 0; } catch (e) { return 0; } }
  function saveHigh() {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(STORAGE_KEY, String(highScore)); } catch (e) {}
    }
    el.high.textContent = highScore;
  }

  // Sound effects (Web Audio, no files)
  let audioCtx = null;
  function beep(freq = 440, dur = 0.08, type = 'square', vol = 0.06) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    tap:  () => beep(500 + taps * 6, 0.05, 'square', 0.05),
    win:  () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'triangle', 0.08), i * 110)),
    lose: () => [300, 220, 150].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'sawtooth', 0.07), i * 160)),
    click:() => beep(700, 0.06, 'triangle', 0.06)
  };

  // Visual effects
  function addRipple(target, e) {
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.6;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    const cx = (e && e.clientX) ? e.clientX : rect.left + rect.width / 2;
    const cy = (e && e.clientY) ? e.clientY : rect.top + rect.height / 2;
    r.style.left = (cx - rect.left - size / 2) + 'px';
    r.style.top = (cy - rect.top - size / 2) + 'px';
    target.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }
  function floatText(text, x, y) {
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = text;
    f.style.left = x + 'px'; f.style.top = y + 'px';
    document.body.appendChild(f);
    f.addEventListener('animationend', () => f.remove());
  }

  function updateHUD() {
    const lv = LEVELS[levelIdx];
    el.level.textContent = levelIdx + 1;
    el.score.textContent = score;
    el.high.textContent = highScore;
    el.count.textContent = taps;
    el.target.textContent = lv.target;
    el.progFill.style.width = Math.min(100, (taps / lv.target) * 100) + '%';
    el.timer.textContent = Math.max(0, timeLeft).toFixed(1);
    el.timeFill.style.width = Math.max(0, (timeLeft / lv.time) * 100) + '%';
    el.timer.classList.toggle('low', timeLeft <= 3 && state === 'playing');
  }

  function showOverlay(title, cls, text, btnText, action) {
    el.ovTitle.textContent = title;
    el.ovTitle.className = cls;
    el.ovText.textContent = text;
    el.ovBtn.textContent = btnText;
    onOverlayBtn = action;
    el.overlay.classList.remove('hidden');
    el.tapBtn.disabled = true;
    el.tapBtn.classList.remove('pulse');
  }

  // Game flow
  function startGame() { levelIdx = 0; score = 0; prepareLevel(); }

  function prepareLevel() {
    const lv = LEVELS[levelIdx];
    taps = 0; timeLeft = lv.time; state = 'ready';
    el.overlay.classList.add('hidden');
    el.tapBtn.disabled = false;
    el.tapBtn.classList.add('pulse');
    updateHUD();
  }

  function beginTimer() {
    state = 'playing';
    el.tapBtn.classList.remove('pulse');
    endTime = performance.now() + timeLeft * 1000;
    clearInterval(timerId);
    timerId = setInterval(() => {
      timeLeft = (endTime - performance.now()) / 1000;
      if (timeLeft <= 0) { timeLeft = 0; updateHUD(); loseGame(); }
      else updateHUD();
    }, 50);
  }

  function handleTap(e) {
    if (state !== 'ready' && state !== 'playing') return;
    if (state === 'ready') beginTimer();
    taps++;
    const pts = 10 * (levelIdx + 1);
    score += pts;
    saveHigh();
    addRipple(el.tapBtn, e);
    sfx.tap();
    const rect = el.tapBtn.getBoundingClientRect();
    floatText('+' + pts,
      ((e && e.clientX) || rect.left + rect.width / 2) - 10,
      ((e && e.clientY) || rect.top + rect.height / 2) - 20);
    updateHUD();
    if (taps >= LEVELS[levelIdx].target) winLevel();
  }

  function winLevel() {
    clearInterval(timerId);
    state = 'over';
    const bonus = Math.round(timeLeft * 10) * (levelIdx + 1);
    score += bonus;
    saveHigh(); updateHUD(); sfx.win();
    if (levelIdx === LEVELS.length - 1) {
      showOverlay('🏆 You Win!', 'win',
        `Saare ${LEVELS.length} levels clear!\nFinal Score: ${score}\nHigh Score: ${highScore}`,
        'Play Again', startGame);
    } else {
      const next = LEVELS[levelIdx + 1];
      showOverlay('Level Cleared!', 'win',
        `Time Bonus: +${bonus}\nScore: ${score}\nAgla: Level ${levelIdx + 2} (${next.target} taps / ${next.time}s)`,
        'Next Level', () => { levelIdx++; prepareLevel(); });
    }
  }

  function loseGame() {
    clearInterval(timerId);
    state = 'over';
    saveHigh(); sfx.lose();
    el.game.classList.add('shake');
    setTimeout(() => el.game.classList.remove('shake'), 400);
    showOverlay('Game Over', 'lose',
      `Level ${levelIdx + 1}: ${taps}/${LEVELS[levelIdx].target} taps\nScore: ${score}\nHigh Score: ${highScore}`,
      'Retry', startGame);
  }

  // Events (pointerdown = touch + mouse, no delay)
  el.tapBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.tapBtn.classList.add('pressed');
    handleTap(e);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    el.tapBtn.addEventListener(ev, () => el.tapBtn.classList.remove('pressed')));
  el.tapBtn.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); handleTap({}); }
  });
  el.ovBtn.addEventListener('pointerdown', e => { addRipple(el.ovBtn, e); sfx.click(); });
  el.ovBtn.addEventListener('click', () => onOverlayBtn());
  el.tapBtn.addEventListener('contextmenu', e => e.preventDefault());

  // Init
  showOverlay('Quick Tap', 'info',
    `Waqt khatam hone se pehle target taps poore karo!\nPehle tap par timer shuru hoga.\n${LEVELS.length} levels, har level mushkil.`,
    'Start', startGame);
  updateHUD();
})();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
